on: push

jobs:
  frameworkctl:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: set extension name
        run: |
          echo "gnome_extension_name=`cat gnome-extension/metadata.json | jq --raw-output .uuid`.shell-extension" >> "$GITHUB_ENV"
      - name: Upload gnome shell extension
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.gnome_extension_name }}
          path: gnome-extension

  frameworkd:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y libudev-dev
      - name: build frameworkd and packages
        run: |
          cargo install cargo-generate-rpm cargo-deb
          cargo build --release
          cargo generate-rpm
          cargo deb
        working-directory: service
      - name: extract package names
        run: |
          RPM_PATH=`ls service/target/generate-rpm/*.rpm`
          echo "rpm_path=$RPM_PATH" >> "$GITHUB_ENV"
          echo "rpm_name=`basename $RPM_PATH`" >> "$GITHUB_ENV"
          
          DEB_PATH=`ls service/target/debian/*.deb`
          echo "deb_path=$DEB_PATH" >> "$GITHUB_ENV"
          echo "deb_name=`basename $DEB_PATH`" >> "$GITHUB_ENV"
      - name: Upload frameworkd
        uses: actions/upload-artifact@v4
        with:
          name: frameworkd
          path: service/target/release/frameworkd
      - name: Upload rpm
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.rpm_name }}
          path: ${{ env.rpm_path }}
      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.deb_name }}
          path: ${{ env.deb_path }}